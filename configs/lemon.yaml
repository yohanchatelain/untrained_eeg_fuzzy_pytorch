# MPI-LEMON (Leipzig Mind-Brain-Body): resting EEG, eyes closed and eyes open, young
# (20-35) and old (59-77) adults. Task 6: young vs old. https://fcon_1000.projects.nitrc.org/indi/retro/MPI_LEMON.html
# We use the authors' preprocessed recordings (EEG_Preprocessed: 1-45 Hz, 250 Hz, ICA
# cleaned, split into EC and EO; 11.9 GB). The raw ones are 68 GB and need the block
# markers; every model here gets the same input, so the comparison within LEMON is fair.

# Leave as null to use data/raw/lemon in the repo, downloaded automatically the first time.
# To use an existing copy, set data_dir or the variable below (wins if both are set).
data_dir: null
data_env: UNTRAINED_EEG_LEMON
openneuro:  # not OpenNeuro: the public S3 bucket of the INDI project
  id: lemon
  bucket: "https://s3.amazonaws.com/fcp-indi"
  prefix: data/Projects/INDI/MPI-LEMON
  include: ["EEG_MPILMBB_LEMON/EEG_Preprocessed_BIDS_ID/EEG_Preprocessed/*",
            "Behavioural_Data_MPILMBB_LEMON/META_File_IDs_Age_Gender_Education_Drug_Smoke_SKID_LEMON.csv"]

cache_dir: data/cache/lemon
results_dir: results

# --- Recordings and preprocessing ----------------------------------------
loader: lemon
recordings_dir: EEG_MPILMBB_LEMON/EEG_Preprocessed_BIDS_ID/EEG_Preprocessed
recording: "EEG_MPILMBB_LEMON/EEG_Preprocessed_BIDS_ID/EEG_Preprocessed/{pid}/{pid}_{tag}.set"
participants_file: Behavioural_Data_MPILMBB_LEMON/META_File_IDs_Age_Gender_Education_Drug_Smoke_SKID_LEMON.csv
channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, FC5, FC1, FC2, FC6, T7, C3, Cz, C4, T8, CP5, CP1, CP2, CP6,
           AFz, P7, P3, Pz, P4, P8, PO9, O1, Oz, O2, PO10, AF7, AF3, AF4, AF8, F5, F1, F2, F6, FT7,
           FC3, FC4, FT8, C5, C1, C2, C6, TP7, CP3, CPz, CP4, TP8, P5, P1, P2, P6, PO7, PO3, POz,
           PO4, PO8]  # all 61 used by the authors; per-recording gaps are interpolated
l_freq: 1.0
h_freq: 40.0
sfreq: 128
segment_s: 60
window_s: 2
max_windows: null

# --- Tasks and probe -----------------------------------------------------
# Age is given in 5-year bins. Young: 20-35, old: 55-80 (the one 35-40 participant is left
# out). Label 1 = old. One task per condition, as for BDI in ds003478.
tasks:
  age_closed: {column: Age, positive: [55-60, 60-65, 65-70, 70-75, 75-80], negative: [20-25, 25-30, 30-35]}
  age_open: {column: Age, positive: [55-60, 60-65, 65-70, 70-75, 75-80], negative: [20-25, 25-30, 30-35]}
cv_folds: 5
cv_seed: 0
