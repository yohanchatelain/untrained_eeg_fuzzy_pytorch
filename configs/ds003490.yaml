# OpenNeuro ds003490: "EEG: 3-Stim Auditory Oddball and Rest in Parkinson's" (Cavanagh, UNM),
# 25 Parkinson's patients (one session on and one off medication, a week apart) and 25 matched
# controls (one session), Brain Products actiCHamp, 64 channels, 500 Hz, reference CPz.
# Used to replicate the Parkinson's task of ds002778 (patients off medication). CC0.

# Leave as null to use data/raw/ds003490 in the repo, downloaded automatically the first
# time (6.3 GB, both sessions). To use an existing copy, set data_dir or the variable below.
data_dir: null
data_env: UNTRAINED_EEG_DS003490
openneuro:
  id: ds003490
  version: "1.1.0"
  include: [participants.tsv, participants.json, dataset_description.json, CHANGES, README,
            "sub-*"]

cache_dir: data/cache/ds003490
results_dir: results

# --- Recordings and preprocessing ----------------------------------------
# Before the oddball task, one minute of eyes closed and one of eyes open, marked by a trigger
# every second (S3/S4 closed, S1/S2 open). Each minute is one 60 s segment of 2 s windows.
l_freq: 1.0
h_freq: 40.0
sfreq: 128
segment_s: 60
window_s: 2
max_windows: null

# --- Probe ---------------------------------------------------------------
cv_folds: 5
cv_seed: 0

loader: rest_spans
recording: "{pid}/ses-{session}/eeg/{pid}_ses-{session}_task-Rest_eeg.set"
session_med: "OFF"  # patients: the session listed OFF in participants.tsv; controls: ses-01
rest_spans: {closed: ["S  3", "S  4", "S3", "S4"], open: ["S  1", "S  2", "S1", "S2"]}
# The 63 scalp channels (VEOG and the hand accelerometer X, Y, Z are left out).
channels: [Fp1, Fz, F3, F7, FT9, FC5, FC1, C3, T7, TP9, CP5, CP1, Pz, P3, P7, O1, Oz, O2, P4,
           P8, TP10, CP6, CP2, Cz, C4, T8, FT10, FC6, FC2, F4, F8, Fp2, AF7, AF3, AFz, F1, F5,
           FT7, FC3, FCz, C1, C5, TP7, CP3, P1, P5, PO7, PO3, POz, PO4, PO8, P6, P2, CP4, TP8,
           C6, C2, FC4, FT8, F6, F2, AF4, AF8]

# Tasks: label 1 = patient. pd_vs_control averages both minutes (ds002778 does not state the
# eyes condition); the _closed / _open variants use one minute each.
tasks:
  pd_vs_control: {column: Group, positive: [PD], negative: [CTL]}
  pd_closed: {column: Group, positive: [PD], negative: [CTL]}
  pd_open: {column: Group, positive: [PD], negative: [CTL]}
