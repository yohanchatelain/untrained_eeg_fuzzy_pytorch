# Settings for OpenNeuro ds003478 v1.1.0 (resting EEG, depression).
# Every script reads this file. Override it with --config path/to/other.yaml.

# Where the BIDS dataset lives. Leave as null to use data/raw/ds003478 in the repo,
# downloaded automatically the first time (run-01 files only, 8.2 GB). To use an existing
# copy (e.g. a shared /project folder), set data_dir or the environment variable
#   export UNTRAINED_EEG_DATA=/path/to/ds003478
# The environment variable wins if both are set.
data_dir: null
openneuro:
  id: ds003478
  version: "1.1.0"
  include: [participants.tsv, participants.json, dataset_description.json, CHANGES, "*_run-01_*"]

# Where preprocessed windows and results are written (both git-ignored).
cache_dir: data/cache
results_dir: results

# --- Which recordings to use ---------------------------------------------
run: "01"                    # run-01 only (high quality, right after hook-up)
exclude_original_ids: [544]  # 544: unstable BDI, excluded in the original study
# The 60 scalp channels, in this order. Everything else (M1, M2, CB1, CB2,
# HEOG, VEOG and an EKG channel present in some files) is dropped.
channels: [
  FP1, FPZ, FP2, AF3, AF4, F7, F5, F3, F1, FZ, F2, F4, F6, F8, FT7,
  FC5, FC3, FC1, FCZ, FC2, FC4, FC6, FT8, T7, C5, C3, C1, CZ, C2, C4,
  C6, T8, TP7, CP5, CP3, CP1, CPZ, CP2, CP4, CP6, TP8, P7, P5, P3, P1,
  PZ, P2, P4, P6, P8, PO7, PO5, PO3, POZ, PO4, PO6, PO8, O1, OZ, O2
]

# --- Labels: high vs low BDI ---------------------------------------------
# Original study used BDI < 7 (low) vs BDI > 16 (high): the same cutoffs for integer scores.
bdi_low_max: 6     # BDI <= 6  -> low  (label 0)
bdi_high_min: 17   # BDI >= 17 -> high (label 1); scores in between are dropped

# --- Preprocessing -------------------------------------------------------
l_freq: 1.0        # band-pass, Hz
h_freq: 40.0
sfreq: 128         # resample to this rate, Hz
segment_s: 60      # each eyes-open / eyes-closed block is cut to 1 minute
window_s: 2        # each minute is split into non-overlapping windows
max_windows: null  # per participant and condition, evenly spaced; null = all.
                   # Set e.g. 20 for quick Fuzzy PyTorch runs (they are ~100x slower).

# Other inputs, for pretrained models trained on different data. Each overrides the
# settings above and is cached in <cache_dir>/<name>/. `pick` keeps a channel subset
# after the 60-channel average reference; `ems` = braindecode's exponential moving
# standardization (on microvolts).
preprocessing:
  bcic2a:  # pretrained ShallowFBCSPNet (braindecode tutorials, BCI IV 2a)
    pick: [Fz, FC3, FC1, FCz, FC2, FC4, C5, C3, C1, Cz, C2, C4, C6,
           CP3, CP1, CPz, CP2, CP4, P1, Pz, P2, POz]
    l_freq: 4.0
    h_freq: 38.0
    sfreq: 250
    ems: {factor_new: 0.001, init_block_size: 1000}

# --- Models and variability ----------------------------------------------
models: [cnn1d, shallow, eegnet]
conditions: [closed, open]
n_seeds: 50          # seed variability: number of random initializations
mca_seed: 0          # MCA variability: the one fixed seed that is re-run
n_mca_samples: 50    # MCA variability: number of Fuzzy PyTorch runs
cv_folds: 5          # logistic-regression probe, stratified K-fold
cv_seed: 0           # the CV split is fixed so only the CNN changes
