# OpenNeuro ds002778: UC San Diego resting EEG, 31 participants (15 Parkinson's, on and off
# medication sessions; 16 controls), BioSemi BDF. Task 5.

# Leave as null to use data/raw/ds002778 in the repo, downloaded automatically the first
# time (0.57 GB). To use an existing copy, set data_dir or the variable below (wins if both
# are set).
data_dir: null
data_env: UNTRAINED_EEG_DS002778
openneuro:
  id: ds002778
  version: "1.0.4"  # S3 serves only the latest snapshot; the downloader warns if it changes
  include: [participants.tsv, participants.json, dataset_description.json, CHANGES, README,
            "sub-*"]

cache_dir: data/cache/ds002778
results_dir: results

# --- Recordings and preprocessing ----------------------------------------
# Continuous resting recordings, cut into 60 s segments of 2 s windows (the shape of
# ds003478's blocks); each participant's features are averaged over all its segments.
l_freq: 1.0
h_freq: 40.0
sfreq: 128
segment_s: 60
window_s: 2
max_windows: null

# --- Probe ---------------------------------------------------------------
cv_folds: 5
cv_seed: 0

# Controls have one session (hc); patients have one off and one on their dopaminergic
# medication. We use the off session (confirmed with Roy).
recording: "{pid}/ses-{session}/eeg/{pid}_ses-{session}_task-rest_eeg.bdf"
sessions: {hc: hc, pd: "off"}  # participant id prefix -> session
condition: rest  # eyes open or closed is not stated in the dataset
channels: [Fp1, AF3, F7, F3, FC1, FC5, T7, C3, CP1, CP5, P7, P3, Pz, PO3, O1, Oz,
           O2, PO4, P4, P8, CP6, CP2, C4, T8, FC6, FC2, F4, F8, AF4, Fp2, Fz, Cz]

# Task: participant id prefix (pd = Parkinson's, hc = control). Label 1 = patient.
tasks:
  pd_vs_control: {column: group, positive: [pd], negative: [hc]}
